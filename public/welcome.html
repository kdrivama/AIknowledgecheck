<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>K Store — Learner Onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #F0EDE8;
      --surface: #E8E4DE;
      --ink:     #0A0A0A;
      --ink-2:   #5C5C5C;
      --ink-3:   #9A9590;
      --border:  #C8C2BA;
      --pass:    #1A5C35;
      --pass-bg: #DFF0E8;
      --fail:    #7A1A1A;
      --fail-bg: #F5E0E0;
      --mono:    "Space Mono", monospace;
      --sans:    "Space Grotesk", sans-serif;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Responsive scaling ── */
    @media (max-width: 600px) {
      main { padding: 24px 16px 60px; }
      .w-heading { font-size: clamp(24px, 7vw, 40px); }
      .w-sub { font-size: 13px; }
      .btn { padding: 10px 18px; font-size: 12px; }
    }

    @media (max-width: 400px) {
      main { padding: 16px 12px 40px; }
      .w-heading { font-size: 22px; }
      header { padding: 0 12px; }
      .h-context { display: none; }
    }

    /* ── Header ── */
    header {
      width: 100%;
      background: var(--ink);
      padding: 0 32px;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
    }
    .h-wordmark { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--bg); }
    .h-slash { color: #444; font-family: var(--mono); font-size: 11px; }
    .h-context { font-family: var(--mono); font-size: 10px; letter-spacing: .05em; color: #777; }
    
    /* ── Main ── */
    main { width: 100%; max-width: 660px; padding: 56px 24px 96px; flex: 1; }

    /* ── Typography & Fields ── */
    .w-course-line { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: .06em; margin-bottom: 20px; text-transform: uppercase; }
    .w-heading { font-size: clamp(40px, 9vw, 60px); font-weight: 700; line-height: 1.0; letter-spacing: -.025em; margin-bottom: 24px; }
    .w-sub { font-size: 15px; color: var(--ink-2); line-height: 1.65; max-width: 460px; margin-bottom: 44px; }

    .field-label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 8px; text-transform: uppercase; }
    .field-input {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid var(--ink); padding: 10px 0;
      font-family: var(--sans); font-size: 16px; color: var(--ink);
      outline: none; margin-bottom: 12px; transition: border-color .15s;
    }
    .field-input::placeholder { color: var(--ink-3); }
    .field-input:focus { border-bottom-color: var(--ink); border-bottom-width: 2px; }

    .error-msg {
      font-family: var(--mono); font-size: 11px; color: var(--fail);
      margin-bottom: 28px; display: none;
    }
    .error-msg.show { display: block; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center;
      font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: .01em;
      cursor: pointer; border: none; transition: opacity .15s, transform .1s; padding: 12px 24px;
      background: var(--ink); color: var(--bg); margin-top: 16px;
    }
    .btn:hover { opacity: .82; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .28; cursor: not-allowed; }

    /* ── Confirmation Box ── */
    .confirmed {
      display: none; align-items: center; gap: 12px;
      margin-top: 32px; padding: 16px 20px;
      background: var(--pass-bg); border-left: 2px solid var(--pass);
    }
    .confirmed.show { display: flex; }
    .check-icon {
      width: 20px; height: 20px; background: var(--pass); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      color: #fff; font-size: 11px; font-weight: 700;
    }
    .confirmed-text { font-family: var(--mono); font-size: 11px; color: var(--pass); }
  </style>
</head>
<body>

<header>
  <span class="h-wordmark">K STORE</span>
  <span class="h-slash">/</span>
  <span class="h-context">Mid-Season Campaign</span>
</header>

<main>
  <p class="w-course-line">Course 2 · Registration</p>
  <h1 class="w-heading">Before<br>we begin</h1>
  <p class="w-sub">Enter your name below. This personalises your assessment and records your results automatically.</p>

  <label class="field-label" for="nameField">Full name</label>
  <input class="field-input" type="text" id="nameField" placeholder="Your name" autocomplete="name" autofocus />
  <div class="error-msg" id="errorMsg">Please enter your full name before continuing.</div>
  
  <button class="btn" id="continueBtn" onclick="saveName()">Continue</button>

  <div class="confirmed" id="confirmed">
    <div class="check-icon">✓</div>
    <span class="confirmed-text" id="confirmedText">Saved — continue the course below.</span>
  </div>
</main>

<script>
  var AI_TUTOR_BASE_URL = "https://kstoreai01.onrender.com";

  function saveName() {
    var input = document.getElementById("nameField");
    var name = input.value.trim();
    var errorMsg = document.getElementById("errorMsg");
    var confirmed = document.getElementById("confirmed");
    var confirmedText = document.getElementById("confirmedText");
    var btn = document.getElementById("continueBtn");

    errorMsg.classList.remove("show");

    if (!name) {
      errorMsg.classList.add("show");
      input.focus();
      return;
    }

    var encodedName = encodeURIComponent(name);
    var tutorURL = AI_TUTOR_BASE_URL + "?name=" + encodedName;

    try {
      localStorage.setItem("kstore_participant_name", name);
      localStorage.setItem("kstore_tutor_url", tutorURL);
    } catch(e) {}

    // Transmit cross-frame message to parent windows
    try { window.parent.postMessage({ type: "KSTORE_NAME_SET", name: name, tutorURL: tutorURL }, "*"); } catch(e) {}
    try { if (window.top !== window.parent) window.top.postMessage({ type: "KSTORE_NAME_SET", name: name, tutorURL: tutorURL }, "*"); } catch(e) {}

    // Send the name to the other web object (AI bot) sitting on the same Storyline slide
    function sendToSiblings() {
      var msg = { type: "KSTORE_NAME_SET", name: name, tutorURL: tutorURL };
      try {
        var sibs = window.parent.frames;
        for (var i = 0; i < sibs.length; i++) {
          try { if (sibs[i] !== window) sibs[i].postMessage(msg, "*"); } catch(e) {}
        }
      } catch(e) {}
    }
    sendToSiblings();
    setTimeout(sendToSiblings, 1000);  // retry in case the bot was still loading
    setTimeout(sendToSiblings, 3000);

    // Pass variable to Storyline Player if running inside Storyline web object
    try {
      if (window.parent && window.parent.GetPlayer) {
        var player = window.parent.GetPlayer();
        player.SetVar("UserName", name);
      }
    } catch(e) {}

    confirmedText.textContent = "Saved — welcome, " + name + ". Continue the course below.";
    confirmed.classList.add("show");
    btn.disabled = true;
    input.disabled = true;
  }

  document.getElementById("nameField").addEventListener("keydown", function(e) {
    if (e.key === "Enter") saveName();
  });

  window.addEventListener("load", function() {
    try {
      var stored = localStorage.getItem("kstore_participant_name");
      if (stored && stored.trim()) {
        document.getElementById("nameField").value = stored.trim();
      }
    } catch(e) {}
  });
</script>
</body>
</html>
